<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3900" viewBox="0 0 1080 3900">
<rect width="100%" height="100%" fill="#f5f9fb"/>
<rect x="0" y="0" width="1080" height="250" fill="#ffffff"/>
<text x="70" y="105" font-size="40" font-weight="700" fill="#15345b">一般社団法人</text>
<text x="70" y="165" font-size="52" font-weight="800" fill="#15345b">日本みらい医療福祉共創協会</text>
<rect x="760" y="70" width="250" height="90" rx="45" fill="#1ea7a1"/>
<text x="805" y="127" font-size="34" font-weight="700" fill="white">無料相談はこちら</text>
<text x="70" y="300" font-size="62" font-weight="800" fill="#15345b">トップ（HOME）</text>
<rect x="50" y="394" width="980" height="840" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="454" font-size="40" font-weight="800" fill="#1ea7a1">ファーストビュー</text>
<text x="85" y="516" font-size="30" font-weight="500" fill="#15345b">ひとりで悩む経営から、対話する経営へ。</text>
<text x="85" y="559" font-size="30" font-weight="500" fill="#15345b">その悩み、私たちに話してください。</text>
<text x="85" y="602" font-size="30" font-weight="500" fill="#15345b">医療・福祉・介護の経営に向き合うあなたの隣に、私たち</text>
<text x="85" y="645" font-size="30" font-weight="500" fill="#15345b">はいます。</text>
<text x="85" y="688" font-size="30" font-weight="500" fill="#15345b"></text>
<text x="85" y="731" font-size="30" font-weight="500" fill="#15345b">中小企業診断士×福祉現場経験者のチームが、</text>
<text x="85" y="774" font-size="30" font-weight="500" fill="#15345b">経営・人材・運営を一体で支援します。</text>
<rect x="85" y="1129" width="560" height="72" rx="36" fill="#1ea7a1"/>
<text x="130" y="1176" font-size="34" font-weight="700" fill="white">まずは無料相談する →</text>
<rect x="50" y="1278" width="980" height="560" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="1338" font-size="40" font-weight="800" fill="#1ea7a1">課題と強み</text>
<text x="85" y="1400" font-size="30" font-weight="500" fill="#15345b">経営の悩み／人材の悩み／運営の悩み</text>
<text x="85" y="1443" font-size="30" font-weight="500" fill="#15345b">・収益改善　・採用定着　・DX化推進</text>
<text x="85" y="1486" font-size="30" font-weight="500" fill="#15345b"></text>
<text x="85" y="1529" font-size="30" font-weight="500" fill="#15345b">強み</text>
<text x="85" y="1572" font-size="30" font-weight="500" fill="#15345b">1) 理論と現場をつなぐ</text>
<text x="85" y="1615" font-size="30" font-weight="500" fill="#15345b">2) 制度・現場・経営を同時に読む</text>
<text x="85" y="1658" font-size="30" font-weight="500" fill="#15345b">3) 答えを押しつけず伴走する</text>
<rect x="85" y="1733" width="560" height="72" rx="36" fill="#1ea7a1"/>
<text x="130" y="1780" font-size="34" font-weight="700" fill="white">私たちの支援内容を見る →</text>
<rect x="50" y="1882" width="980" height="640" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="1942" font-size="40" font-weight="800" fill="#1ea7a1">支援概要と流れ</text>
<text x="85" y="2004" font-size="30" font-weight="500" fill="#15345b">経営軸｜人材軸｜運営軸を一体支援</text>
<text x="85" y="2047" font-size="30" font-weight="500" fill="#15345b">STEP1 事前アンケート（約5分）</text>
<text x="85" y="2090" font-size="30" font-weight="500" fill="#15345b">STEP2 初回面談（無料・約60分）</text>
<text x="85" y="2133" font-size="30" font-weight="500" fill="#15345b">STEP3 診断レポート（有償）</text>
<text x="85" y="2176" font-size="30" font-weight="500" fill="#15345b">STEP4 継続支援（任意）</text>
<rect x="85" y="2417" width="560" height="72" rx="36" fill="#1ea7a1"/>
<text x="130" y="2464" font-size="34" font-weight="700" fill="white">ご相談の流れを詳しく見る →</text>
<rect x="50" y="2566" width="980" height="520" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="2626" font-size="40" font-weight="800" fill="#1ea7a1">メンバー紹介・ミッション</text>
<text x="85" y="2688" font-size="30" font-weight="500" fill="#15345b">持田 貴郁（代表理事）</text>
<text x="85" y="2731" font-size="30" font-weight="500" fill="#15345b">河野 良太郎（理事）</text>
<text x="85" y="2774" font-size="30" font-weight="500" fill="#15345b">岸 忠生（監事）</text>
<text x="85" y="2817" font-size="30" font-weight="500" fill="#15345b"></text>
<text x="85" y="2860" font-size="30" font-weight="500" fill="#15345b">制度と現場と経営をつなぎ、</text>
<text x="85" y="2903" font-size="30" font-weight="500" fill="#15345b">持続可能な未来を共に創る。</text>
<rect x="85" y="2981" width="560" height="72" rx="36" fill="#1ea7a1"/>
<text x="130" y="3028" font-size="34" font-weight="700" fill="white">メンバーを詳しく見る →</text>
</svg>