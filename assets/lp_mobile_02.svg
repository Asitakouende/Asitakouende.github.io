<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3900" viewBox="0 0 1080 3900">
<rect width="100%" height="100%" fill="#f5f9fb"/>
<rect x="0" y="0" width="1080" height="250" fill="#ffffff"/>
<text x="70" y="105" font-size="40" font-weight="700" fill="#15345b">一般社団法人</text>
<text x="70" y="165" font-size="52" font-weight="800" fill="#15345b">日本みらい医療福祉共創協会</text>
<rect x="760" y="70" width="250" height="90" rx="45" fill="#1ea7a1"/>
<text x="805" y="127" font-size="34" font-weight="700" fill="white">無料相談はこちら</text>
<text x="70" y="300" font-size="62" font-weight="800" fill="#15345b">私たちについて（ABOUT）</text>
<rect x="50" y="394" width="980" height="520" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="454" font-size="40" font-weight="800" fill="#1ea7a1">法人概要</text>
<text x="85" y="516" font-size="30" font-weight="500" fill="#15345b">法人名：一般社団法人 日本みらい医療福祉共創協会</text>
<text x="85" y="559" font-size="30" font-weight="500" fill="#15345b">設立：2025年5月15日</text>
<text x="85" y="602" font-size="30" font-weight="500" fill="#15345b">所在地：東京都北区赤羽1-59-8</text>
<text x="85" y="645" font-size="30" font-weight="500" fill="#15345b">活動エリア：東京都・埼玉県中心、全国対応</text>
<rect x="50" y="958" width="980" height="760" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="1018" font-size="40" font-weight="800" fill="#1ea7a1">MVV・実績</text>
<text x="85" y="1080" font-size="30" font-weight="500" fill="#15345b">MISSION：制度と現場と経営をつなぎ、持続可能な</text>
<text x="85" y="1123" font-size="30" font-weight="500" fill="#15345b">未来を共創</text>
<text x="85" y="1166" font-size="30" font-weight="500" fill="#15345b">VISION：地域に根ざし、全国で信頼される共創拠点</text>
<text x="85" y="1209" font-size="30" font-weight="500" fill="#15345b">VALUE：共に考える／現場起点／人材定着／着実な変</text>
<text x="85" y="1252" font-size="30" font-weight="500" fill="#15345b">化／誠実</text>
<text x="85" y="1295" font-size="30" font-weight="500" fill="#15345b"></text>
<text x="85" y="1338" font-size="30" font-weight="500" fill="#15345b">年間300件超の経営相談対応経験をベースに、</text>
<text x="85" y="1381" font-size="30" font-weight="500" fill="#15345b">経営改善・資金繰り・補助金・人材定着・事業承継を支援</text>
<text x="85" y="1424" font-size="30" font-weight="500" fill="#15345b">。</text>
<rect x="50" y="1762" width="980" height="980" rx="26" fill="#ffffff" stroke="#e6f3f3" stroke-width="3"/>
<text x="85" y="1822" font-size="40" font-weight="800" fill="#1ea7a1">メンバー詳細・連携専門家</text>
<text x="85" y="1884" font-size="30" font-weight="500" fill="#15345b">持田 貴郁：中小企業診断士ほか多数資格</text>
<text x="85" y="1927" font-size="30" font-weight="500" fill="#15345b">河野 良太郎：介護ITインストラクター</text>
<text x="85" y="1970" font-size="30" font-weight="500" fill="#15345b">岸 忠生：IT活用・業務効率化支援</text>
<text x="85" y="2013" font-size="30" font-weight="500" fill="#15345b"></text>
<text x="85" y="2056" font-size="30" font-weight="500" fill="#15345b">医療・福祉・介護・労務・法務など</text>
<text x="85" y="2099" font-size="30" font-weight="500" fill="#15345b">分野別の連携専門家ネットワークで</text>
<text x="85" y="2142" font-size="30" font-weight="500" fill="#15345b">案件ごとに最適な支援チームを編成します。</text>
<rect x="85" y="2637" width="560" height="72" rx="36" fill="#1ea7a1"/>
<text x="130" y="2684" font-size="34" font-weight="700" fill="white">会員・連携専門家募集を見る →</text>
</svg>