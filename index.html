<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日本みらい医療福祉共創協会 | スマホLP</title>
  <style>
    :root { --lp-max: 430px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #eaf0f4; color: #15345b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow-x: hidden; }
    .page { min-height: 100vh; display: flex; justify-content: center; }
    .lp { width: 100%; max-width: var(--lp-max); background: #fff; position: relative; box-shadow: 0 8px 28px rgba(20, 52, 91, 0.15); }
    .slice { position: relative; width: 100%; line-height: 0; }
    .slice img { width: 100%; height: auto; display: block; }
    .hotspot { position: absolute; background: rgba(30, 167, 161, 0.08); border: 1px solid rgba(21, 52, 91, 0.14); border-radius: 999px; cursor: pointer; }
    .hotspot:hover, .hotspot:focus-visible { background: rgba(30, 167, 161, 0.18); outline: none; }
    .fixed-cta-wrap { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; pointer-events: none; }
    .fixed-cta { width: min(calc(100vw - 20px), calc(var(--lp-max) - 20px)); pointer-events: auto; border: 0; border-radius: 999px; background: linear-gradient(135deg, #13a8a0, #0a8f8f); color: #fff; font-size: 16px; font-weight: 700; padding: 14px 18px; box-shadow: 0 8px 20px rgba(10,143,143,.35); }
    .sr-only { position: absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(11, 24, 42, .58); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.show { display: flex; }
    .modal { width: min(92vw, 420px); background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 16px 44px rgba(0,0,0,.28); }
    .modal h2 { margin: 0 0 8px; font-size: 20px; }
    .modal p { margin: 0 0 14px; line-height: 1.6; }
    .modal button { border: 0; border-radius: 10px; padding: 10px 16px; background: #15345b; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
<div class="page">
  <main class="lp">
    <h1 class="sr-only">一般社団法人 日本みらい医療福祉共創協会 ランディングページ</h1>

    <section class="slice" id="s1">
      <img src="assets/lp_mobile_01.svg" alt="トップページ ビジュアル" />
      <button class="hotspot" style="left:8%;top:28.9%;width:52%;height:2.2%;" data-type="form" aria-label="無料相談する"></button>
      <button class="hotspot" style="left:8%;top:44.4%;width:52%;height:2.2%;" data-type="jump" data-target="#s3" aria-label="支援内容を見る"></button>
      <button class="hotspot" style="left:8%;top:63.5%;width:52%;height:2.2%;" data-type="jump" data-target="#s3" aria-label="ご相談の流れを見る"></button>
      <button class="hotspot" style="left:8%;top:81.5%;width:52%;height:2.2%;" data-type="jump" data-target="#s2" aria-label="メンバーを見る"></button>
    </section>

    <section class="slice" id="s2">
      <img src="assets/lp_mobile_02.svg" alt="私たちについて ビジュアル" />
      <button class="hotspot" style="left:8%;top:67.6%;width:52%;height:2.3%;" data-type="modal" data-title="会員・連携専門家募集" data-message="募集要項ページは準備中です。お問い合わせフォームからご連絡ください。" aria-label="会員募集を見る"></button>
    </section>

    <section class="slice" id="s3">
      <img src="assets/lp_mobile_03.svg" alt="サービス紹介 ビジュアル" />
      <button class="hotspot" style="left:8%;top:70.6%;width:52%;height:2.3%;" data-type="form" aria-label="無料相談はこちら"></button>
      <button class="hotspot" style="left:60%;top:6.7%;width:32%;height:7.8%;border-radius:16px;" data-type="video" aria-label="紹介動画を見る"></button>
    </section>

    <section class="slice" id="s4">
      <img src="assets/lp_mobile_04.svg" alt="お問い合わせ ビジュアル" />
      <button class="hotspot" style="left:8%;top:15.6%;width:84%;height:6.2%;border-radius:16px;" data-type="form" aria-label="Googleフォームを開く"></button>
      <button class="hotspot" style="left:8%;top:61.4%;width:52%;height:2.3%;" data-type="form" aria-label="無料相談はこちら"></button>
    </section>

    <section class="slice" id="s5">
      <img src="assets/lp_mobile_05.svg" alt="プライバシーポリシー ビジュアル" />
    </section>

    <div class="sr-only">
      <h2>重要情報（スクリーンリーダー用）</h2>
      <p>初回相談は無料です。東京都・埼玉県を中心に全国対応しています。</p>
      <p>お問い合わせは3営業日以内に返信します。メール: t.mochida@mirai-welfare.com</p>
    </div>
  </main>
</div>

<div class="fixed-cta-wrap"><button class="fixed-cta" data-type="form">無料相談はこちら</button></div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">お知らせ</h2>
    <p id="modalMessage">リンク先は準備中です。</p>
    <button id="modalClose">閉じる</button>
  </div>
</div>

<script>
const FORM_URL = 'https://forms.gle/placeholder';
const VIDEO_URL = '';
const backdrop = document.getElementById('modalBackdrop');
const titleEl = document.getElementById('modalTitle');
const messageEl = document.getElementById('modalMessage');
const closeBtn = document.getElementById('modalClose');

function openModal(title, message){ titleEl.textContent = title; messageEl.textContent = message; backdrop.classList.add('show'); backdrop.setAttribute('aria-hidden', 'false'); closeBtn.focus(); }
function closeModal(){ backdrop.classList.remove('show'); backdrop.setAttribute('aria-hidden', 'true'); }
function handleAction(type, el){
  if(type === 'form') window.open(FORM_URL, '_blank', 'noopener');
  else if(type === 'jump') document.querySelector(el.dataset.target)?.scrollIntoView({behavior:'smooth', block:'start'});
  else if(type === 'video') VIDEO_URL ? window.open(VIDEO_URL, '_blank', 'noopener') : openModal('紹介動画', '動画リンクは現在準備中です。公開までお待ちください。');
  else openModal(el.dataset.title || '準備中', el.dataset.message || 'リンク先は現在準備中です。');
}

document.querySelectorAll('[data-type]').forEach(el => el.addEventListener('click', () => handleAction(el.dataset.type, el)));
closeBtn.addEventListener('click', closeModal);
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
